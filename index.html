<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Snake</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="shell" aria-label="Jogo Snake">
      <section class="game-card">
        <header class="scorebar" aria-label="Placar">
          <div>
            <span class="score-label">Pontos</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="score-label">Arena</span>
            <strong id="arenaNumber">1</strong>
          </div>
          <div>
            <span class="score-label">Recorde</span>
            <strong id="bestScore">0</strong>
          </div>
        </header>

        <div class="board-wrap">
          <canvas id="gameCanvas" width="480" height="480" aria-label="Tabuleiro do Snake. Deslize para controlar a cobra em telas touch."></canvas>
        </div>

        <div class="game-footer">
          <p class="hint">Setas ou WASD para mover. ESC pausa.</p>
          <button id="touchPauseButton" class="touch-pause-button secondary" type="button" aria-label="Pausar" title="Pausar">&#x23F8;</button>
        </div>
      </section>

      <section id="menuScreen" class="overlay is-visible" aria-label="Menu inicial">
        <div class="panel">
          <h1>SNAKE</h1>
          <div class="menu-record">Recorde <strong id="menuBestScore">0</strong></div>
          <button id="playButton" type="button">JOGAR</button>
          <div id="accountGuest" class="account-row">
            <button id="openLoginButton" type="button" class="secondary">ENTRAR</button>
          </div>
          <div id="accountUser" class="account-row" hidden>
            <span id="playerNickname" class="account-name"></span>
            <button id="logoutButton" type="button" class="secondary">SAIR</button>
          </div>
          <p id="menuAuthNotice" class="auth-message" role="status" hidden></p>
        </div>
      </section>

      <section id="pauseScreen" class="overlay" aria-label="Pausa">
        <div class="panel">
          <h2>PAUSA</h2>
          <button id="continueButton" type="button">CONTINUAR</button>
          <button id="restartPauseButton" type="button">REINICIAR</button>
          <button id="menuPauseButton" type="button" class="secondary">VOLTAR AO MENU</button>
        </div>
      </section>

      <section id="gameOverScreen" class="overlay" aria-label="Game over">
        <div class="panel">
          <h2>GAME OVER</h2>
          <div class="result-line">Pontuação <strong id="finalScore">0</strong></div>
          <div class="result-line">Recorde <strong id="finalBestScore">0</strong></div>
          <p id="onlineScoreStatus" class="auth-message" role="status" aria-live="polite" hidden></p>
          <button id="playAgainButton" type="button">JOGAR NOVAMENTE</button>
          <button id="menuGameOverButton" type="button" class="secondary">VOLTAR AO MENU</button>
        </div>
      </section>

      <section id="authScreen" class="overlay auth-overlay" aria-label="Conta">
        <div class="panel auth-panel">
          <div id="loginView" class="auth-view">
            <h2>ENTRAR</h2>
            <form id="loginForm" class="auth-form">
              <label>E-mail<input name="email" type="email" autocomplete="email" required /></label>
              <label>Senha<input name="password" type="password" autocomplete="current-password" required /></label>
              <button type="submit">ENTRAR</button>
            </form>
            <button id="showSignupButton" type="button" class="secondary">CRIAR CONTA</button>
            <button id="showRecoveryButton" type="button" class="auth-link">ESQUECI MINHA SENHA</button>
          </div>

          <div id="signupView" class="auth-view" hidden>
            <h2>CRIAR CONTA</h2>
            <form id="signupForm" class="auth-form">
              <label>Nickname<input name="nickname" type="text" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="nickname" required /></label>
              <label>E-mail<input name="email" type="email" autocomplete="email" required /></label>
              <label>Senha<input name="password" type="password" minlength="8" autocomplete="new-password" required /></label>
              <div class="password-rules">
                <span>A senha deve conter:</span>
                <ul>
                  <li>8 caracteres ou mais</li>
                  <li>1 letra maiúscula</li>
                  <li>1 letra minúscula</li>
                  <li>1 número</li>
                </ul>
              </div>
              <label>Confirmar senha<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
              <button type="submit">CRIAR CONTA</button>
            </form>
            <button id="signupToLoginButton" type="button" class="secondary">JÁ TENHO CONTA</button>
          </div>

          <div id="recoveryView" class="auth-view" hidden>
            <h2>RECUPERAR SENHA</h2>
            <form id="recoveryForm" class="auth-form">
              <label>E-mail<input name="email" type="email" autocomplete="email" required /></label>
              <button type="submit">ENVIAR LINK</button>
            </form>
            <button id="recoveryToLoginButton" type="button" class="secondary">VOLTAR AO LOGIN</button>
          </div>

          <div id="resetView" class="auth-view" hidden>
            <h2>NOVA SENHA</h2>
            <form id="resetForm" class="auth-form">
              <label>Nova senha<input name="password" type="password" minlength="8" autocomplete="new-password" required /></label>
              <label>Confirmar senha<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
              <button type="submit">SALVAR SENHA</button>
            </form>
          </div>

          <p id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></p>
          <button id="closeAuthButton" type="button" class="secondary">VOLTAR AO MENU</button>
        </div>
      </section>
    </main>

    <script src="js/game.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/online.js"></script>
  </body>
</html>
